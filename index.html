<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — 100 fantasmas na prospecção</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#000000;
    --panel:#111111;
    --panel-2:#171717;
    --line:#2A2A2A;
    --gold:#A9D92B;
    --gold-dim:#6F9016;
    --text:#FFFFFF;
    --text-dim:#A8A8A8;
    --danger:#E2544A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 24px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0;
    background:var(--bg);
    z-index:5;
    flex-wrap:wrap;
  }
  header svg{width:30px; height:auto; flex-shrink:0;}
  header h1{
    font-family:'Archivo Black',sans-serif;
    font-size:18px;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .tag{
    color:var(--gold);
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-weight:600;
  }
  .titles{display:flex; flex-direction:column; gap:2px; margin-right:auto;}

  main{
    max-width:1000px;
    margin:0 auto;
    padding:24px 20px 80px;
  }

  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .stat b{color:var(--gold); font-size:15px; display:block; font-family:'Archivo Black',sans-serif;}

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    align-items:center;
  }
  input[type=text], select, textarea{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  input[type=text]:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--gold);
  }
  .search{flex:1; min-width:180px;}
  .filter{min-width:140px;}

  .btn{
    background:var(--gold);
    color:#000;
    border:none;
    font-weight:700;
    font-size:14px;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{background:#bfe94f;}
  .btn.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{border-color:var(--gold); color:var(--gold);}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  .btn.danger:hover{background:var(--danger); color:#000;}
  .btn.small{padding:6px 12px; font-size:12.5px;}

  .empty{
    text-align:center;
    color:var(--text-dim);
    padding:60px 20px;
    border:1px dashed var(--line);
    border-radius:12px;
  }

  .grid{display:flex; flex-direction:column; gap:12px;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--gold-dim);}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-name{font-weight:700; font-size:16px;}
  .card-meta{color:var(--text-dim); font-size:12.5px; margin-top:3px;}
  .sector-tag{
    display:inline-block;
    background:#1D1D1D;
    color:var(--text-dim);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:2px 8px;
    border-radius:100px;
    margin-top:6px;
  }
  .badge{
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:4px 9px;
    border-radius:100px;
    white-space:nowrap;
  }
  .badge.novo{background:#2A2A2A; color:var(--text-dim);}
  .badge.contactado{background:rgba(169,217,43,0.15); color:var(--gold);}
  .badge.negociacao{background:rgba(230,180,50,0.15); color:#E6B432;}
  .badge.cliente{background:var(--gold); color:#000;}
  .badge.parado{background:rgba(226,84,74,0.15); color:var(--danger);}

  .card-summary{
    margin-top:10px;
    color:var(--text-dim);
    font-size:13px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:6px 16px;
  }
  .card-summary b{color:var(--text); font-weight:600;}
  .alert-flag{color:var(--danger); font-weight:700; margin-top:8px;}

  .pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin-top:20px;
    color:var(--text-dim);
    font-size:13px;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:30px 16px;
    z-index:20;
    overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    width:100%;
    max-width:640px;
    padding:22px;
  }
  .modal h2{
    font-family:'Archivo Black',sans-serif;
    font-size:19px;
    margin:0 0 16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--gold);
    letter-spacing:0.05em;
    text-transform:uppercase;
    margin-bottom:5px;
    font-weight:600;
  }
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{min-height:60px; resize:vertical; font-family:'Inter',sans-serif;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:560px){.row2, .row3{grid-template-columns:1fr;}}

  .section-label{
    color:var(--text-dim);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    margin:18px 0 8px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }

  .modal-actions{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .modal-actions .right{display:flex; gap:10px;}

  .toast{
    position:fixed;
    bottom:20px; left:50%;
    transform:translateX(-50%);
    background:var(--gold);
    color:#000;
    font-weight:700;
    font-size:13px;
    padding:10px 18px;
    border-radius:100px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:30;
  }
  .toast.show{opacity:1;}

  .loading{color:var(--text-dim); text-align:center; padding:40px;}
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 100 130" fill="none"><path d="M20 60 C20 30 35 15 50 15 C65 15 80 30 80 60 L80 105 C80 105 74 98 68 105 C62 112 56 98 50 105 C44 112 38 98 32 105 C26 98 20 105 20 105 Z" fill="#FFFFFF"/><ellipse cx="38" cy="55" rx="4.5" ry="6" fill="#000000"/><ellipse cx="62" cy="55" rx="4.5" ry="6" fill="#000000"/></svg>
  <div class="titles">
    <h1>CRM de Prospeção</h1>
    <span class="tag">100 fantasmas na prospecção</span>
  </div>
  <button class="btn secondary" id="btnExport">Exportar</button>
  <button class="btn secondary" id="btnImport">Importar</button>
  <input type="file" id="fileImport" accept=".json" style="display:none;">
  <button class="btn" id="btnNew">+ Nova empresa</button>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="text" class="search" id="search" placeholder="Pesquisar por nome, NIF, sede ou contacto...">
    <select class="filter" id="filterSetor"><option value="">Todos os setores</option></select>
    <select class="filter" id="filterStatus">
      <option value="">Todos os estados</option>
      <option value="novo">Novo</option>
      <option value="contactado">Contactado</option>
      <option value="negociacao">Em negociação</option>
      <option value="cliente">Cliente</option>
      <option value="parado">Não avançar</option>
    </select>
  </div>

  <div id="loading" class="loading">A carregar...</div>
  <div id="empty" class="empty" style="display:none;">
    Nenhuma empresa encontrada com estes filtros.
  </div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nova empresa</h2>
    <input type="hidden" id="editId">

    <div class="row2">
      <div class="field">
        <label>Nome da empresa</label>
        <input type="text" id="f_name" placeholder="Ex: +Apoio, Unipessoal Lda">
      </div>
      <div class="field">
        <label>Setor</label>
        <input type="text" id="f_setor" placeholder="Ex: Imobiliárias, Transportes...">
      </div>
    </div>

    <div class="row3">
      <div class="field">
        <label>NIF</label>
        <input type="text" id="f_nif" placeholder="510862055">
      </div>
      <div class="field">
        <label>Sede / Morada</label>
        <input type="text" id="f_sede" placeholder="Faro">
      </div>
      <div class="field">
        <label>Estado no CRM</label>
        <select id="f_status">
          <option value="novo">Novo</option>
          <option value="contactado">Contactado</option>
          <option value="negociacao">Em negociação</option>
          <option value="cliente">Cliente</option>
          <option value="parado">Não avançar</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Contacto (nome / número)</label>
        <input type="text" id="f_contacto" placeholder="Ex: Ricardo · 932699470">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="text" id="f_email" placeholder="geral@empresa.pt">
      </div>
    </div>

    <div class="section-label">Análise de prospeção (opcional)</div>

    <div class="field">
      <label>Tempo de mercado</label>
      <input type="text" id="f_tempo" placeholder="Ex: 12 anos, desde 2013">
    </div>

    <div class="field">
      <label>Indícios de insolvência / dívidas / ações judiciais</label>
      <textarea id="f_insolvencia" placeholder="Ex: sem indícios encontrados..."></textarea>
    </div>

    <div class="field">
      <label>Redes sociais e anúncios pagos</label>
      <textarea id="f_redes"></textarea>
    </div>

    <div class="field">
      <label>Site</label>
      <textarea id="f_site"></textarea>
    </div>

    <div class="field">
      <label>Loja online</label>
      <textarea id="f_loja"></textarea>
    </div>

    <div class="field">
      <label>Google My Business / Maps</label>
      <textarea id="f_gmb"></textarea>
    </div>

    <div class="field">
      <label>Pontos de abertura para contacto/proposta</label>
      <textarea id="f_pontos" style="min-height:80px;"></textarea>
    </div>

    <div class="field">
      <label>Notas adicionais</label>
      <textarea id="f_notas"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn danger" id="btnDelete" style="display:none;">Eliminar</button>
      <div class="right">
        <button class="btn secondary" id="btnCancel">Cancelar</button>
        <button class="btn" id="btnSave">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  const $ = (id) => document.getElementById(id);
  const grid = $('grid');
  const overlay = $('overlay');
  const toastEl = $('toast');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 1800);
  }

  async function loadCompanies(){
    $('loading').style.display = 'block';
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      companies = raw ? JSON.parse(raw) : null;
    }catch(e){
      companies = null;
    }
    if(!companies){
      companies = SEED_DATA;
      await persist();
    }
    $('loading').style.display = 'none';
    populateSectorFilter();
    render();
  }

  async function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(companies));
    }catch(e){
      showToast('Erro ao guardar (armazenamento cheio?)');
    }
  }

  function populateSectorFilter(){
    const sectors = [...new Set(companies.map(c => c.setor).filter(Boolean))].sort();
    const sel = $('filterSetor');
    sel.innerHTML = '<option value="">Todos os setores</option>' + sectors.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  }

  function statusLabel(s){
    return {novo:'Novo', contactado:'Contactado', negociacao:'Em negociação', cliente:'Cliente', parado:'Não avançar'}[s] || 'Novo';
  }

  function renderStats(){
    const total = companies.length;
    const byStatus = {};
    companies.forEach(c => { byStatus[c.status||'novo'] = (byStatus[c.status||'novo']||0)+1; });
    $('stats').innerHTML = `
      <div class="stat"><b>${total}</b>Total</div>
      <div class="stat"><b>${byStatus.novo||0}</b>Novos</div>
      <div class="stat"><b>${byStatus.contactado||0}</b>Contactados</div>
      <div class="stat"><b>${byStatus.negociacao||0}</b>Em negociação</div>
      <div class="stat"><b>${byStatus.cliente||0}</b>Clientes</div>
    `;
  }

  function getFiltered(){
    const q = $('search').value.trim().toLowerCase();
    const st = $('filterStatus').value;
    const setor = $('filterSetor').value;
    return companies.filter(c => {
      const matchesQ = !q || (c.name||'').toLowerCase().includes(q) || (c.nif||'').toLowerCase().includes(q) || (c.sede||'').toLowerCase().includes(q) || (c.contacto||'').toLowerCase().includes(q);
      const matchesSt = !st || c.status === st;
      const matchesSetor = !setor || c.setor === setor;
      return matchesQ && matchesSt && matchesSetor;
    }).sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  }

  function render(){
    renderStats();
    const filtered = getFiltered();
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage-1)*PAGE_SIZE;
    const pageItems = filtered.slice(start, start+PAGE_SIZE);

    grid.innerHTML = '';
    $('empty').style.display = (filtered.length === 0) ? 'block' : 'none';

    pageItems.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openEdit(c.id);

      const insolvFlag = c.insolvencia && !/sem ind[ií]cio/i.test(c.insolvencia) && c.insolvencia.trim().length > 0
        ? `<div class="alert-flag">⚠ ${escapeHtml(c.insolvencia).slice(0,90)}${c.insolvencia.length>90?'…':''}</div>` : '';

      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="card-name">${escapeHtml(c.name || 'Sem nome')}</div>
            <div class="card-meta">${escapeHtml(c.nif||'—')} · ${escapeHtml(c.sede||'—')} · ${escapeHtml(c.contacto||'—')}</div>
            ${c.setor ? `<span class="sector-tag">${escapeHtml(c.setor)}</span>` : ''}
          </div>
          <span class="badge ${c.status||'novo'}">${statusLabel(c.status)}</span>
        </div>
        ${(c.redes||c.site||c.loja||c.gmb) ? `<div class="card-summary">
          ${c.redes ? `<div><b>Redes:</b> ${escapeHtml(truncate(c.redes))}</div>` : ''}
          ${c.site ? `<div><b>Site:</b> ${escapeHtml(truncate(c.site))}</div>` : ''}
          ${c.loja ? `<div><b>Loja online:</b> ${escapeHtml(truncate(c.loja))}</div>` : ''}
          ${c.gmb ? `<div><b>GMB:</b> ${escapeHtml(truncate(c.gmb))}</div>` : ''}
        </div>` : ''}
        ${insolvFlag}
      `;
      grid.appendChild(card);
    });

    const pag = $('pagination');
    if(totalPages > 1){
      pag.innerHTML = `
        <button class="btn secondary small" id="prevPage" ${currentPage<=1?'disabled':''}>‹ Anterior</button>
        <span>Página ${currentPage} de ${totalPages} (${filtered.length} empresas)</span>
        <button class="btn secondary small" id="nextPage" ${currentPage>=totalPages?'disabled':''}>Seguinte ›</button>
      `;
      $('prevPage').onclick = () => { currentPage--; render(); window.scrollTo({top:0,behavior:'smooth'}); };
      $('nextPage').onclick = () => { currentPage++; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    } else {
      pag.innerHTML = filtered.length ? `<span>${filtered.length} empresas</span>` : '';
    }
  }

  function truncate(s){
    if(!s) return '—';
    return s.length > 60 ? s.slice(0,60)+'…' : s;
  }
  function escapeHtml(s){
    if(!s) return '';
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function openNew(){
    $('modalTitle').textContent = 'Nova empresa';
    $('editId').value = '';
    ['f_name','f_setor','f_nif','f_sede','f_contacto','f_email','f_tempo','f_insolvencia','f_redes','f_site','f_loja','f_gmb','f_pontos','f_notas'].forEach(id => $(id).value = '');
    $('f_status').value = 'novo';
    $('btnDelete').style.display = 'none';
    overlay.classList.add('open');
  }

  function openEdit(id){
    const c = companies.find(x => x.id === id);
    if(!c) return;
    $('modalTitle').textContent = c.name || 'Editar empresa';
    $('editId').value = c.id;
    $('f_name').value = c.name || '';
    $('f_setor').value = c.setor || '';
    $('f_nif').value = c.nif || '';
    $('f_sede').value = c.sede || '';
    $('f_status').value = c.status || 'novo';
    $('f_contacto').value = c.contacto || '';
    $('f_email').value = c.email || '';
    $('f_tempo').value = c.tempo || '';
    $('f_insolvencia').value = c.insolvencia || '';
    $('f_redes').value = c.redes || '';
    $('f_site').value = c.site || '';
    $('f_loja').value = c.loja || '';
    $('f_gmb').value = c.gmb || '';
    $('f_pontos').value = c.pontos || '';
    $('f_notas').value = c.notas || '';
    $('btnDelete').style.display = 'inline-block';
    overlay.classList.add('open');
  }

  function closeModal(){
    overlay.classList.remove('open');
  }

  async function saveCompany(){
    const name = $('f_name').value.trim();
    if(!name){ showToast('Indica pelo menos o nome da empresa'); return; }

    const id = $('editId').value || (Date.now().toString(36) + Math.random().toString(36).slice(2,7));
    const data = {
      id,
      name,
      setor: $('f_setor').value.trim(),
      nif: $('f_nif').value.trim(),
      sede: $('f_sede').value.trim(),
      status: $('f_status').value,
      contacto: $('f_contacto').value.trim(),
      email: $('f_email').value.trim(),
      tempo: $('f_tempo').value.trim(),
      insolvencia: $('f_insolvencia').value.trim(),
      redes: $('f_redes').value.trim(),
      site: $('f_site').value.trim(),
      loja: $('f_loja').value.trim(),
      gmb: $('f_gmb').value.trim(),
      pontos: $('f_pontos').value.trim(),
      notas: $('f_notas').value.trim(),
      updatedAt: Date.now()
    };

    const idx = companies.findIndex(x => x.id === id);
    if(idx >= 0) companies[idx] = data;
    else companies.push(data);

    await persist();
    populateSectorFilter();
    render();
    closeModal();
    showToast('Empresa guardada');
  }

  async function deleteCompany(){
    const id = $('editId').value;
    if(!id) return;
    if(!confirm('Eliminar esta empresa do CRM?')) return;
    companies = companies.filter(x => x.id !== id);
    await persist();
    render();
    closeModal();
    showToast('Empresa eliminada');
  }

  $('btnNew').onclick = openNew;
  $('btnCancel').onclick = closeModal;
  $('btnSave').onclick = saveCompany;
  $('btnDelete').onclick = deleteCompany;
  $('search').oninput = () => { currentPage = 1; render(); };
  $('filterStatus').onchange = () => { currentPage = 1; render(); };
  $('filterSetor').onchange = () => { currentPage = 1; render(); };
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  $('btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(companies, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'crm-prospecao-backup.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Ficheiro exportado');
  };

  $('btnImport').onclick = () => $('fileImport').click();
  $('fileImport').onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const imported = JSON.parse(text);
      if(!Array.isArray(imported)) throw new Error('formato inválido');
      companies = imported;
      await persist();
      populateSectorFilter();
      currentPage = 1;
      render();
      showToast('Dados importados com sucesso');
    }catch(err){
      showToast('Erro ao importar ficheiro');
    }
    e.target.value = '';
  };

  loadCompanies();
</script>

</body>
</html>
